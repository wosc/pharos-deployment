dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap
namespace inbox {
  inbox = yes
  separator = .
  # like courier-imap
  prefix = INBOX.
}

ssl = yes
ssl_server_cert_file = /srv/letsencrypt/data/mail.wosc.de/fullchain.pem
ssl_server_key_file = /srv/letsencrypt/data/mail.wosc.de/key.pem
ssl_server_dh_file = /usr/share/dovecot/dh.pem

# log failed attempts
auth_verbose = yes
# each entry uses <500B, we have <10 users, leave some room for negative hits
auth_cache_size = 1M
passdb sql {
  sql_driver = mysql
  query = SELECT password FROM mailboxes WHERE login="%{user}" AND has_mailbox=1
  default_password_scheme = SHA512-CRYPT
}
!include /etc/dovecot/dovecot-sql.conf.ext


mail_uid = Debian-exim
# Allow Debian-exim uid
first_valid_uid = 100
mail_gid = Debian-exim
mail_home = /var/mail/%{user | username}.%{user | domain}
mail_driver = maildir
mail_path = ~/Maildir
